<div id="picture-prompt-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Picture Prompt</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="flex-container marginTopBot5">
                <label class="checkbox_label" for="picture_prompt_enabled" title="Inject images into the prompt for multimodal LLMs">
                    <input id="picture_prompt_enabled" type="checkbox">
                    Enable Picture Prompt
                </label>
            </div>

            <div class="inline-drawer">
                <div class="inline-drawer-toggle inline-drawer-header">
                    <b>Avatar Injection</b>
                    <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
                </div>
                <div class="inline-drawer-content">
                    <div class="flex-container alignItemsCenter marginTopBot5">
                        <span>Inject:</span>
                        <select id="picture_prompt_target" class="text_pole widthNatural">
                            <option value="character">Character avatar</option>
                            <option value="persona">User persona avatar</option>
                            <option value="both">Both</option>
                        </select>
                    </div>

                    <div class="flex-container alignItemsCenter marginTopBot5">
                        <span>Label for character avatar:</span>
                        <input id="picture_prompt_label_char" class="text_pole" type="text" placeholder="e.g. This is how you look:">
                    </div>
                    <div class="flex-container alignItemsCenter marginTopBot5">
                        <span>Label for persona avatar:</span>
                        <input id="picture_prompt_label_user" class="text_pole" type="text" placeholder="e.g. This is how {{user}} looks:">
                    </div>
                </div>
            </div>

            <!-- Extra Images Drawer -->
            <div class="flex-container marginTopBot5">
                <label class="checkbox_label" title="Automatically inject extra images into prompts">
                    <input id="picture_prompt_extra_images_enabled" type="checkbox">
                    Auto-inject extra images
                </label>
            </div>

            <div class="flex-container alignItemsCenter marginTopBot5">
                <span>Max images to inject:</span>
                <input id="picture_prompt_extra_images_max" class="text_pole" style="width:4em" type="number" min="0" max="20" value="8">
            </div>

            <hr style="margin: 0.75rem 0; opacity: 0.3;">

            <div class="flex-container marginTopBot5">
                <label class="checkbox_label" title="Inject pinned gallery images for the current character">
                    <input id="picture_prompt_char_extra_enabled" type="checkbox">
                    Auto-inject character gallery images
                </label>
            </div>

            <div class="flex-container alignItemsCenter marginTopBot5" style="margin-bottom: 0.5rem;">
                <span>Max gallery images to inject:</span>
                <input id="picture_prompt_char_extra_max" class="text_pole" style="width:4em" type="number" min="0" max="20" value="8">
            </div>
            <div style="font-size: 0.85em; color: var(--text-color-dim);">
                Pin images via the <b>Gallery</b> &rarr; <b>𖡡</b> Inject mode button.
            </div>
        </div>
    </div>
</div>

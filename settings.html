<div id="picture-prompt-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Picture Prompt</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <!-- Master toggle -->
            <div class="pp-master-group">
            <div class="pp-setting-row">
                <label class="checkbox_label" for="picture_prompt_enabled" title="Master toggle - disables all image injection when off">
                    <input id="picture_prompt_enabled" type="checkbox">
                    Enable Picture Prompt
                </label>
            </div>
            <hr>
            </div>

            <div class="pp-settings-group">
                <!-- Character Avatar -->
                <div class="pp-setting-row">
                    <label class="checkbox_label" for="picture_prompt_inject_char" title="Inject the character's avatar image into the prompt">
                        <input id="picture_prompt_inject_char" type="checkbox">
                        Inject Character Avatar
                    </label>
                    <select class="pp-quality-select" id="picture_prompt_quality_char_avatar" title="Image detail quality for character avatar">
                        <option value="global">Global</option><option value="low">Low</option><option value="auto">Auto</option><option value="high">High</option>
                    </select>
                </div>
                <div class="pp-sub-row" id="pp_char_label_row">
                    <span class="pp-sub-label">Label:</span>
                    <input id="picture_prompt_label_char" class="text_pole" type="text"
                           placeholder="This is how you look:"
                           title="This text will be injected into the prompt before the character's avatar.">
                </div>

                <!-- Persona Avatar -->
                <div class="pp-setting-row">
                    <label class="checkbox_label" for="picture_prompt_inject_persona" title="Inject your persona avatar image into the prompt">
                        <input id="picture_prompt_inject_persona" type="checkbox">
                        Inject Persona Avatar
                    </label>
                    <select class="pp-quality-select" id="picture_prompt_quality_persona_avatar" title="Image detail quality for persona avatar">
                        <option value="global">Global</option><option value="low">Low</option><option value="auto">Auto</option><option value="high">High</option>
                    </select>
                </div>
                <div class="pp-sub-row" id="pp_persona_label_row">
                    <span class="pp-sub-label">Label:</span>
                    <input id="picture_prompt_label_user" class="text_pole" type="text"
                           placeholder="This is how {{user}} looks:"
                           title="This text will be injected into the prompt before your persona avatar.">
                </div>
            </div>
            <hr>

            <div class="pp-settings-group">
                <!-- Persona Extra Images -->
                <div class="pp-setting-row">
                    <label class="checkbox_label" for="picture_prompt_extra_images_enabled" title="Inject uploaded extra images attached to your persona">
                        <input id="picture_prompt_extra_images_enabled" type="checkbox">
                        Inject persona extra images
                    </label>
                    <div class="pp-right-controls" id="pp_extras_controls">
                    <span class="pp-counter">
                        <label for="picture_prompt_extra_images_max">Max</label>
                        <input id="picture_prompt_extra_images_max" class="text_pole" type="number" min="0" max="20" value="8" title="Maximum number of extra images to inject per request">
                    </span>
                    <select class="pp-quality-select" id="picture_prompt_quality_extra_images" title="Image detail quality for persona extra images">
                        <option value="global">Global</option><option value="low">Low</option><option value="auto">Auto</option><option value="high">High</option>
                    </select>
                    </div>
                </div>

                <!-- Gallery Images -->
                <div class="pp-setting-row">
                    <label class="checkbox_label" for="picture_prompt_char_extra_enabled" title="Pin images via Gallery → 𖡡 Inject mode.">
                        <input id="picture_prompt_char_extra_enabled" type="checkbox">
                        Inject gallery images
                    </label>
                    <div class="pp-right-controls" id="pp_gallery_controls">
                    <span class="pp-counter">
                        <label for="picture_prompt_char_extra_max">Max</label>
                        <input id="picture_prompt_char_extra_max" class="text_pole" type="number" min="0" max="20" value="8" title="Maximum number of gallery images to inject per request">
                    </span>
                    <select class="pp-quality-select" id="picture_prompt_quality_char_extra" title="Image detail quality for gallery images">
                        <option value="global">Global</option><option value="low">Low</option><option value="auto">Auto</option><option value="high">High</option>
                    </select>
                    </div>
                </div>

                <!-- Lorebook Images -->
                <div class="pp-setting-row">
                    <label class="checkbox_label" for="picture_prompt_lorebook_enabled" title="Inject images from triggered lorebook / world info entries">
                        <input id="picture_prompt_lorebook_enabled" type="checkbox">
                        Inject lorebook entry images
                    </label>
                    <div class="pp-right-controls" id="pp_lorebook_controls">
                    <span class="pp-counter">
                        <label for="picture_prompt_lorebook_max">Max</label>
                        <input id="picture_prompt_lorebook_max" class="text_pole" type="number" min="0" max="20" value="4" title="Maximum number of lorebook images to inject per request">
                    </span>
                    <select class="pp-quality-select" id="picture_prompt_quality_lorebook" title="Image detail quality for lorebook images">
                        <option value="global">Global</option><option value="low">Low</option><option value="auto">Auto</option><option value="high">High</option>
                    </select>
                    </div>
                </div>
            </div>
            <hr>

            <!-- Estimation -->
            <div class="pp-estimate">
                <div class="flex-container alignItemsCenter">
                    <span class="pp-estimate-header">Estimated image tokens:</span>
                    <span id="picture_prompt_token_estimate" class="pp-token-count">--</span>
                </div>
                <div class="pp-breakdown" id="picture_prompt_token_breakdown"></div>
            </div>
        </div>
    </div>
</div>

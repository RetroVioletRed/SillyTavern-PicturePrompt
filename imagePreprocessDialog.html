<div>
    <h3>Image Upload</h3>
    <div class="pp-prep-file-list">
        {{#each files}}
            <div class="pp-prep-file-row {{#if accepted}}pp-prep-accepted{{else}}pp-prep-rejected{{/if}}">
                <span class="pp-prep-file-name">{{name}}</span>
                {{#unless accepted}}
                    <span class="pp-prep-file-reason">— {{reason}}</span>
                {{/unless}}
            </div>
        {{/each}}
    </div>
</div>

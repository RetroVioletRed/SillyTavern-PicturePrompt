<div>
    <h3>Image Upload</h3>
    <div class="pp-prep-file-list">
        {{#each files}}
            <div class="pp-prep-file-row {{#if animated}}pp-prep-warning{{else if accepted}}pp-prep-accepted{{else}}pp-prep-rejected{{/if}}">
                {{#if accepted}}
                    <img class="pp-prep-preview" src="{{previewUrl}}" alt="{{name}}">
                    <div class="pp-prep-file-info">
                        <span class="pp-prep-file-name">{{name}}</span>
                        <span class="pp-prep-file-dims">{{width}}×{{height}}</span>
                        {{#if animated}}
                            <span class="pp-prep-file-warning">⚠️ {{warning}}</span>
                        {{/if}}
                        {{#if needsResize}}
                            <label class="pp-prep-toggle" title="Shrinks images to fit within vision model limits. Saves tokens with no quality loss. Uncheck to upload at original resolution.">
                                <input type="checkbox" class="pp-prep-resize" data-index="{{@index}}" checked>
                                Resize to {{maxDimension}}px
                            </label>
                        {{/if}}
                        <label class="pp-prep-toggle" title="Re-encodes as WebP with lossy compression. Saves tokens with a small quality loss. May alter colors or lose transparency in non-WebP formats.">
                            <input type="checkbox" class="pp-prep-webp" data-index="{{@index}}" {{#if webpDefault}}checked{{/if}}>
                            Convert to WebP
                        </label>
                    </div>
                {{else}}
                    <span class="pp-prep-file-name">{{name}}</span>
                    <span class="pp-prep-file-reason">— {{reason}}</span>
                {{/if}}
            </div>
        {{/each}}
    </div>
</div>
